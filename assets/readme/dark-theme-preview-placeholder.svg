<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dark-theme stickman video preview placeholder</title>
  <desc id="desc">A white stick figure presents a vivid purple and cyan vortex on a deep black canvas.</desc>
  <defs>
    <radialGradient id="dark-bg" cx="72%" cy="42%" r="72%">
      <stop offset="0" stop-color="#18102f"/>
      <stop offset="0.5" stop-color="#090910"/>
      <stop offset="1" stop-color="#030306"/>
    </radialGradient>
    <linearGradient id="dark-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c42ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="dark-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="dark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#dark-bg)"/>
  <rect width="1280" height="720" rx="36" fill="url(#dark-grid)"/>
  <rect x="34" y="34" width="1212" height="652" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

