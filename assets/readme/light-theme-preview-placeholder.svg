<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Light-theme stickman video preview placeholder</title>
  <desc id="desc">A black stick figure presents energetic blue and purple motion graphics on a clean white canvas.</desc>
  <defs>
    <linearGradient id="light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="light-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#8b2cff"/>
    </linearGradient>
    <pattern id="light-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#111827" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="light-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#3151a3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#light-bg)"/>
  <rect width="1280" height="720" rx="36" fill="url(#light-grid)"/>
  <rect x="34" y="34" width="1212" height="652" rx="28" fill="none" stroke="#111827" stroke-opacity="0.12" stroke-width="2"/>

