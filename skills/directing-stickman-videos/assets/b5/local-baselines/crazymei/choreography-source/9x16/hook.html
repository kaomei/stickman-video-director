const tl=gsap.timeline({paused:true}),clock={t:0},dur=6.16;

const $=s=>document.querySelector(s),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,q)=>a+(b-a)*q,rad=v=>v*Math.PI/180;
const out=q=>1-Math.pow(1-clamp(q),3),io=q=>{q=clamp(q);return q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2},back=q=>{q=clamp(q)-1;return 1+3.2*q*q*q+2.2*q*q};
function val(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){let [a,x]=keys[i-1],[b,y,e]=keys[i];let q=clamp((t-a)/(b-a));q=e==='out'?out(q):e==='in'?q*q*q:e==='back'?back(q):e==='io'?io(q):q;return lerp(x,y,q)}}return keys[keys.length-1][1]}
function at(id,o){let el=$(id);if(!el)return;let {x=0,y=0,s=1,sx=s,sy=s,r=0,a=1}=o;el.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${sx} ${sy})`);el.setAttribute('opacity',a);el.style.opacity=a}
function vis(id,a){if($(id)){$(id).setAttribute('opacity',a);$(id).style.opacity=a}}
function limb(id,start,a,b,L1=86,L2=84){let [x,y]=start,x1=x+Math.cos(rad(a))*L1,y1=y+Math.sin(rad(a))*L1,x2=x1+Math.cos(rad(b))*L2,y2=y1+Math.sin(rad(b))*L2;$(id).setAttribute('d',`M${x} ${y}L${x1} ${y1}L${x2} ${y2}`)}
function rig(id,p={}){let d={x:490,y:1180,s:1,r:0,sx:1,sy:1,la:145,lb:95,ra:35,rb:85,ll:115,lk:95,rl:65,rk:85,head:0,mood:'happy',...p};at('#'+id,{x:d.x,y:d.y,sx:d.s*d.sx,sy:d.s*d.sy,r:d.r,a:d.a===undefined?1:d.a});limb('#'+id+'-la',[0,-265],d.la,d.lb);limb('#'+id+'-ra',[0,-265],d.ra,d.rb);limb('#'+id+'-ll',[0,-150],d.ll,d.lk,80,80);limb('#'+id+'-rl',[0,-150],d.rl,d.rk,80,80);$('#'+id+'-head').setAttribute('transform',`rotate(${d.head} 0 -285)`);let m=d.mood;$('#'+id+'-mouth').setAttribute('d',m==='shock'?'M-14 -325Q0 -346 14 -325Q18 -302 0 -301Q-18 -302 -14 -325Z':m==='sad'?'M-22 -310Q0 -334 22 -310':m==='flat'?'M-21 -316L21 -316':m==='grit'?'M-24 -329L24 -329L24 -308H-24Z':'M-23 -326Q0 -296 23 -326');if(m==='flat'){$('#'+id+'-head').setAttribute('transform','translate(120 -345) scale(.65 4.5) translate(0 345)');$('#'+id+'-body').setAttribute('d','M120 -290L0 -240L0 -150')}else{$('#'+id+'-body').setAttribute('d','M0 -280L0 -150')};$('#'+id+'-mouth').setAttribute('fill',m==='shock'?'#1E1C1A':m==='grit'?'#FBFAF8':'none');$('#'+id+'-eyes').setAttribute('transform',`translate(${m==='shock'?0:Math.sin(p.look||0)*7} -350) scale(1 ${m==='flat'?.35:m==='shock'?1.5:1}) translate(0 350)`)}
function shake(t,hits){let x=0,y=0,r=0,z=1;for(const [at,mag] of hits){let d=t-at;if(d>=0&&d<.52){let e=Math.pow(1-d/.52,2);x+=Math.sin(d*123)*mag*e;y+=Math.cos(d*91)*mag*.65*e;r+=Math.sin(d*99)*mag*.08*e;z+=.12*Math.sin(Math.PI*clamp(d/.36))}}return{x,y,r,z}}
function camera(t,hits,zoom=1,cx=540,cy=920){let q=shake(t,hits),s=zoom*q.z;$('#camera').setAttribute('transform',`translate(${cx+q.x} ${cy+q.y}) rotate(${q.r}) scale(${s}) translate(${-cx} ${-cy})`)}
function heading(t,hit){const q=clamp((t-hit)/.24);let s=t<hit?1:lerp(1.22,1,1-Math.pow(1-q,5));const el=$('.scene-heading');let d=t-hit,e=d>=0&&d<.35?1-d/.35:0;el.style.transform=`translate(${Math.sin(d*110)*7*e}px,${Math.cos(d*90)*4*e}px) rotate(${Math.sin(d*110)*.7*e}deg) scale(${s})`;const p=$('.underline path');if(p)p.style.strokeDashoffset=850*(1-out((t-hit-.12)/.32))}
function orbitStars(id,t,active,x,y){vis(id,active?1:0);if(!active)return;at(id,{x,y,r:t*110});}

function pose(local){let t=local+0;
camera(t,[[2.82,22],[3.52,11]],1+.07*Math.sin(clamp((t-2.64)/.5)*Math.PI));
if(t<2.64){rig('hero',{x:370+Math.sin(t*2)*9,y:1180-5*Math.sin(t*3),r:-12,la:222,lb:282,ra:-35,rb:-105,ll:125,lk:55,rl:55,rk:15,head:Math.sin(t*2)*5,look:t});}
else if(t<4.78){let u=t-2.64;rig('hero',{x:val(t,[[2.64,370],[2.9,405],[3.52,175,'io']]),y:val(t,[[2.64,1180],[2.98,1040,'out'],[3.52,1194,'in'],[3.67,1175],[3.83,1200]]),r:val(t,[[2.64,-12],[2.95,-35],[3.52,82,'in'],[3.7,75],[3.88,82]]),sx:t>3.5?1.12:1,sy:t>3.5?.86:1,la:225+Math.sin(u*18)*20,lb:180,ra:-65,rb:-20,ll:135,lk:40,rl:32,rk:100,mood:'shock'});}
else{let q=out((t-4.78)/.52);rig('hero',{x:lerp(175,435,q),y:lerp(1200,1180,q)-Math.sin(q*Math.PI)*100,r:lerp(82,0,q)+Math.sin(t*9)*3,la:145,lb:lerp(180,-110,q),ra:35,rb:lerp(-20,-70,q),mood:'shock',head:Math.sin(t*8)*8});}

[260,525,790].forEach((x,i)=>{let u=t-4.78-i*.12;at('#mistake-num-'+i,{x,y:val(u,[[0,540],[.3,780,'back'],[1.4,770]])+Math.sin(u*6+i)*8,r:Math.sin(u*5+i)*8,s:clamp(u/.14),a:u>=0?1:0})});
